# Render Blueprint for the FinConnect monorepo. The API is private: browsers
# reach it only through the public Next.js same-origin proxy.
databases:
  - name: finconnect-db
    plan: starter
    databaseName: finconnect
    user: finconnect

services:
  - name: finconnect-redis
    type: keyvalue
    plan: starter
    ipAllowList: []

  - name: finconnect-api
    type: pserv
    runtime: node
    plan: starter
    buildCommand: >-
      corepack enable && corepack prepare pnpm@11.22.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build:shared &&
      pnpm --filter @finance/api run prisma:generate &&
      pnpm --filter @finance/api build
    preDeployCommand: pnpm --filter @finance/api run prisma:deploy
    startCommand: pnpm --filter @finance/api start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: finconnect-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: EMAIL_DRIVER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false

  - name: finconnect-web
    type: web
    runtime: node
    plan: starter
    buildCommand: >-
      corepack enable && corepack prepare pnpm@11.22.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm build:shared &&
      pnpm --filter @finance/web build
    startCommand: pnpm --filter @finance/web start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_INTERNAL_URL
        fromService:
          name: finconnect-api
          type: pserv
          property: hostport
